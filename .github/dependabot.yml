version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Asia/Singapore
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:15"
      timezone: Asia/Singapore
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
