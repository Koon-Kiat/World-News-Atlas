name: Deploy to Cloudflare

# Deploys main to the self-hosted Worker once CI has passed on it. The Worker
# sits behind Cloudflare Access; see docs/cloudflare-deployment.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEWS_DEPLOY_TARGET: cloudflare
      NEWS_PRODUCTION_WRANGLER_CONFIG: wrangler.production.jsonc
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Worker
        run: npm run build
      - name: Apply and verify D1 migrations
        run: npm run db:migrate:production
      - name: Deploy Worker
        run: npx wrangler deploy
