name: News ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Discovery period
        required: false
        default: latest
        type: choice
        options: [latest, 24h, 7d, 30d]

permissions:
  contents: read

concurrency:
  group: production-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      GDELT_MODE: auto
      NEWS_FIXTURES_ENABLED: "false"
      NEWS_INGESTION_STAGE_LIMIT: "24"
      NEWS_INGESTION_COUNTRY_BATCH_SIZE: "8"
    steps:
      - name: Check database configuration
        id: database
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            {
              echo "### News ingestion is not configured"
              echo
              echo "The optional DATABASE_URL repository secret is not set, so this scheduled persistence pass was skipped."
              echo "Add a PostgreSQL connection string that is reachable from GitHub-hosted runners to enable migrations and ingestion."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        if: steps.database.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        if: steps.database.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install dependencies
        if: steps.database.outputs.configured == 'true'
        run: npm ci
      - name: Apply database migrations
        if: steps.database.outputs.configured == 'true'
        run: npx prisma migrate deploy
      - name: Run bounded resumable ingestion
        if: steps.database.outputs.configured == 'true'
        run: npm run ingest:news -- --period=${{ github.event_name == 'schedule' && '30d' || inputs.period || 'latest' }}
