name: News ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Discovery period
        required: false
        default: 30d
        type: choice
        options: [latest, 24h, 7d, 30d]

permissions:
  contents: read

concurrency:
  group: production-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEWS_INGEST_URL: ${{ secrets.NEWS_INGEST_URL }}
      NEWS_INGEST_HMAC_SECRET: ${{ secrets.NEWS_INGEST_HMAC_SECRET }}
      OAI_SITES_BYPASS_TOKEN: ${{ secrets.OAI_SITES_BYPASS_TOKEN }}
      PERIOD: ${{ github.event_name == 'schedule' && '30d' || inputs.period || '30d' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - name: Run all bounded ingestion scopes
        run: node scripts/scheduled-ingestion.mjs
