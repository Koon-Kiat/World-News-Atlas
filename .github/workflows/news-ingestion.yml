name: News ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Discovery period
        required: false
        default: 30d
        type: choice
        options: [latest, 24h, 7d, 30d]

permissions:
  contents: read

concurrency:
  group: production-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEWS_INGEST_URL: ${{ secrets.NEWS_INGEST_URL }}
      NEWS_INGEST_HMAC_SECRET: ${{ secrets.NEWS_INGEST_HMAC_SECRET }}
      OAI_SITES_BYPASS_TOKEN: ${{ secrets.OAI_SITES_BYPASS_TOKEN }}
      PERIOD: ${{ github.event_name == 'schedule' && '30d' || inputs.period || '30d' }}
    steps:
      - name: Trigger bounded Sites ingestion
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NEWS_INGEST_URL" || -z "$NEWS_INGEST_HMAC_SECRET" ]]; then
            echo "NEWS_INGEST_URL and NEWS_INGEST_HMAC_SECRET must be configured as repository secrets." >&2
            exit 1
          fi

          for SCOPE in global countries countries; do
            TIMESTAMP="$(date +%s)"
            NONCE="$(openssl rand -hex 24)"
            BODY="$(printf '{\"period\":\"%s\",\"mode\":\"incremental\",\"scope\":\"%s\",\"stageLimit\":4}' "$PERIOD" "$SCOPE")"
            export TIMESTAMP NONCE BODY
            SIGNATURE="$(python3 - <<'PY'
          import hashlib
          import hmac
          import os

          canonical = f"{os.environ['TIMESTAMP']}.{os.environ['NONCE']}.{os.environ['BODY']}"
          print(hmac.new(
              os.environ["NEWS_INGEST_HMAC_SECRET"].encode(),
              canonical.encode(),
              hashlib.sha256,
          ).hexdigest())
          PY
            )"

            CURL_HEADERS=(
              --header 'Content-Type: application/json'
              --header "X-Ingest-Timestamp: $TIMESTAMP"
              --header "X-Ingest-Nonce: $NONCE"
              --header "X-Ingest-Signature: $SIGNATURE"
            )
            if [[ -n "$OAI_SITES_BYPASS_TOKEN" ]]; then
              CURL_HEADERS+=(--header "OAI-Sites-Authorization: Bearer $OAI_SITES_BYPASS_TOKEN")
            fi
            STATUS="$(curl --silent --show-error --output ingestion-response.json --write-out '%{http_code}' \
              --request POST "$NEWS_INGEST_URL" "${CURL_HEADERS[@]}" --data-binary "$BODY")"
            if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
              echo "Sites ingestion failed with HTTP $STATUS." >&2
              exit 1
            fi
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("ingestion-response.json", encoding="utf-8") as response_file:
              response = json.load(response_file)
          summary = response["summary"]
          print(f"- `{summary['runId']}`: {summary['stagesProcessed']} stages, "
                f"{summary['stored']} articles stored, {summary['storiesUpdated']} stories updated")
          PY
          done
