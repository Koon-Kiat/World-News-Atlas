name: News ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 2,14 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Discovery period
        required: false
        default: 24h
        type: choice
        options: [latest, 24h, 7d, 30d]

permissions:
  contents: read

concurrency:
  group: production-news-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEWS_INGEST_URL: ${{ secrets.NEWS_INGEST_URL }}
      NEWS_INGEST_HMAC_SECRET: ${{ secrets.NEWS_INGEST_HMAC_SECRET }}
      OAI_SITES_BYPASS_TOKEN: ${{ secrets.OAI_SITES_BYPASS_TOKEN }}
      PERIOD: ${{ inputs.period || '24h' }}
      INGESTION_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - name: Run all bounded ingestion scopes
        run: node scripts/scheduled-ingestion.mjs
